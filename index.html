<!DOCTYPE html>
<html>
<head>
  <title>Sam’s Apple Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5f5;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 25px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .section {
      padding: 30px 20px;
      text-align: center;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
    }

    .card h3 {
      margin: 10px 0;
    }

    .floating-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      color: white;
      padding: 15px;
      border-radius: 50%;
      font-size: 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Sam’s Apple Store</h1>
  <p>iPhones for sale • Swapping • Trusted Deals</p>

  <a class="btn" href="https://wa.me/233538603560?text=Hi%20I%20saw%20your%20website%20and%20I%20want%20to%20buy%20an%20iPhone">
    View Latest iPhones on WhatsApp
  </a>
</header>

<section class="section">
  <h2>Available iPhones</h2>

  <div class="products">
    <div class="card">
      <h3>iPhone 11</h3>
      <p>Clean • Affordable</p>
    </div>

    <div class="card">
      <h3>iPhone 12</h3>
      <p>Fast • Sleek Design</p>
    </div>

    <div class="card">
      <h3>iPhone 13</h3>
      <p>Premium Performance</p>
    </div>

    <div class="card">
      <h3>iPhone 14</h3>
      <p>Latest Model</p>
    </div>
  </div>
</section>

<section class="section">
  <h2>Location</h2>
  <p>Takoradi – Opposite Ecobank</p>
</section>

<!-- Floating WhatsApp Button -->
<a class="floating-btn" href="https://wa.me/233538603560?text=Hi%20I%20want%20to%20buy%20an%20iPhone">
  💬
</a>

</body>
</html>
